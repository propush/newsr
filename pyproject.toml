[project]
name = "newsr"
version = "0.1.0"
description = "Local-first terminal news reader with provider-backed sources, translation, and summaries"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.13.0",
  "dbus-fast>=4.0; sys_platform == 'linux'",
  "edge-tts>=7.2",
  "miniaudio>=1.71",
  "Pillow>=12.1.0",
  "piper-tts>=1.8",
  "pyobjc-framework-Cocoa>=11.0; sys_platform == 'darwin'",
  "pyobjc-framework-MediaPlayer>=11.0; sys_platform == 'darwin'",
  "PyYAML>=6.0.2",
  "textual>=3.1.1",
  "winrt-Windows.Foundation>=3.0; sys_platform == 'win32'",
  "winrt-Windows.Media>=3.0; sys_platform == 'win32'",
  "winrt-Windows.Media.Playback>=3.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
]
silero = [
  "num2words>=0.5.14",
  "numpy>=2.0",
  "pymorphy3>=2.0",
  "pymorphy3-dicts-ru>=2.4",
  "scipy>=1.13",
  "torch>=2.5",
  "transformers>=4.45",
]

[project.scripts]
newsr = "newsr.app:main"

[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
  "provider_home: exercises the provider-home startup flow",
]
